<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EdgeSpam-IoT</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            background:
                linear-gradient(135deg, #0f172a, #1e293b);

            padding: 30px 20px;

        }


        .container {

            width: 100%;

            max-width: 900px;

            margin: auto;

            background: white;

            border-radius: 20px;

            padding: 35px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.3);

        }


        h1 {

            text-align: center;

            color: #0f172a;

            margin-bottom: 8px;

        }


        .subtitle {

            text-align: center;

            color: #64748b;

            margin-bottom: 30px;

        }


        /* DASHBOARD */

        .dashboard {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 30px;

        }


        .card {

            background: #f8fafc;

            border: 1px solid #e2e8f0;

            border-radius: 14px;

            padding: 18px 10px;

            text-align: center;

        }


        .card-title {

            font-size: 13px;

            color: #64748b;

            margin-bottom: 8px;

        }


        .card-value {

            font-size: 27px;

            font-weight: bold;

            color: #0f172a;

        }


        .spam-card .card-value {

            color: #dc2626;

        }


        .ham-card .card-value {

            color: #16a34a;

        }


        .average-card .card-value {

            color: #2563eb;

        }


        label {

            display: block;

            font-weight: bold;

            margin-bottom: 10px;

            color: #334155;

        }


        textarea {

            width: 100%;

            height: 150px;

            resize: none;

            border: 2px solid #cbd5e1;

            border-radius: 12px;

            padding: 15px;

            font-size: 16px;

            outline: none;

        }


        textarea:focus {

            border-color: #2563eb;

        }


        button {

            width: 100%;

            margin-top: 18px;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background: #2563eb;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            background: #1d4ed8;

        }


        button:disabled {

            background: #94a3b8;

            cursor: not-allowed;

        }


        #result {

            margin-top: 25px;

            padding: 20px;

            border-radius: 12px;

            background: #f1f5f9;

            display: none;

            text-align: center;

        }


        #classification {

            font-size: 28px;

            font-weight: bold;

            margin-bottom: 10px;

        }


        #probability {

            font-size: 18px;

            color: #475569;

            margin-bottom: 10px;

        }


        #status-message {

            font-size: 15px;

            color: #64748b;

        }


        .history-title {

            margin-top: 35px;

            margin-bottom: 15px;

            color: #0f172a;

        }


        .history {

            width: 100%;

            overflow-x: auto;

        }


        table {

            width: 100%;

            border-collapse: collapse;

            font-size: 14px;

        }


        th {

            background: #0f172a;

            color: white;

            padding: 12px;

            text-align: left;

        }


        td {

            padding: 12px;

            border-bottom: 1px solid #e2e8f0;

            vertical-align: top;

        }


        .spam {

            color: #dc2626;

            font-weight: bold;

        }


        .ham {

            color: #16a34a;

            font-weight: bold;

        }


        .time {

            color: #64748b;

            white-space: nowrap;

        }


        .clear-button {

            background: #64748b;

            margin-top: 15px;

        }


        .clear-button:hover {

            background: #475569;

        }


        .footer {

            text-align: center;

            margin-top: 25px;

            color: #94a3b8;

            font-size: 13px;

        }


        .loading {

            text-align: center;

            color: #64748b;

            padding: 15px;

        }


        /* MOBILE */

        @media (max-width: 700px) {

            .dashboard {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }


        @media (max-width: 450px) {

            .dashboard {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>


<body>


    <div class="container">


        <h1>EdgeSpam-IoT</h1>


        <p class="subtitle">

            AI-Based SMS Spam Detection

        </p>


        <!-- DASHBOARD -->

        <div class="dashboard">


            <div class="card">

                <div class="card-title">
                    Total Predictions
                </div>

                <div
                    class="card-value"
                    id="totalCount">

                    0

                </div>

            </div>


            <div class="card spam-card">

                <div class="card-title">
                    SPAM Messages
                </div>

                <div
                    class="card-value"
                    id="spamCount">

                    0

                </div>

            </div>


            <div class="card ham-card">

                <div class="card-title">
                    HAM Messages
                </div>

                <div
                    class="card-value"
                    id="hamCount">

                    0

                </div>

            </div>


            <div class="card average-card">

                <div class="card-title">
                    Avg. Spam Probability
                </div>

                <div
                    class="card-value"
                    id="averageProbability">

                    0%

                </div>

            </div>

        </div>


        <!-- SMS INPUT -->

        <label for="message">

            Enter SMS Message

        </label>


        <textarea
            id="message"
            placeholder="Example: Congratulations! You have won a prize..."></textarea>


        <button
            id="checkButton"
            onclick="checkSMS()">

            Check SMS

        </button>


        <!-- RESULT -->

        <div id="result">

            <div id="classification"></div>

            <div id="probability"></div>

            <div id="status-message"></div>

        </div>


        <!-- HISTORY -->

        <h2 class="history-title">

            Prediction History

        </h2>


        <div class="history">


            <table>

                <thead>

                    <tr>

                        <th>SMS</th>

                        <th>Result</th>

                        <th>Probability</th>

                        <th>Date & Time</th>

                    </tr>

                </thead>


                <tbody id="historyBody">

                    <tr>

                        <td
                            colspan="4"
                            class="loading">

                            Loading history...

                        </td>

                    </tr>

                </tbody>

            </table>


        </div>


        <button
            class="clear-button"
            onclick="clearHistory()">

            Clear History

        </button>


        <div class="footer">

            Powered by Machine Learning

        </div>


    </div>


    <script>
        // API Base URL (can be overridden via window.API_BASE_URL, defaults to same-origin)
        const API_BASE = window.API_BASE_URL || "";

        // Resilient fetch helper: tries /api/<endpoint> first, then fallback to /<endpoint>
        async function fetchAPI(endpoint, options = {}) {
            const urls = [
                `${API_BASE}/api${endpoint}`,
                `${API_BASE}${endpoint}`
            ];

            let lastResponse = null;
            let lastError = null;

            for (const url of urls) {
                try {
                    const res = await fetch(url, options);
                    if (res.ok || res.status === 400) {
                        return res;
                    }
                    lastResponse = res;
                    if (res.status === 404 || res.status === 405) {
                        continue;
                    }
                    return res;
                } catch (err) {
                    lastError = err;
                }
            }

            if (lastResponse) return lastResponse;
            throw lastError || new Error("Failed to connect to backend");
        }

        // =========================================
        // LOCAL STORAGE & DASHBOARD SYNC
        // =========================================
        function getLocalHistory() {
            try {
                const saved = localStorage.getItem("edgespam_history");
                return saved ? JSON.parse(saved) : [];
            } catch (e) {
                console.error("Local storage read error:", e);
                return [];
            }
        }

        function saveLocalHistory(items) {
            try {
                localStorage.setItem("edgespam_history", JSON.stringify(items));
            } catch (e) {
                console.error("Local storage save error:", e);
            }
        }

        function renderHistory(items) {
            const historyBody = document.getElementById("historyBody");
            historyBody.innerHTML = "";

            if (!items || items.length === 0) {
                historyBody.innerHTML = `
                    <tr>
                        <td colspan="4" class="loading">No predictions yet.</td>
                    </tr>
                `;
                return;
            }

            items.forEach(function(item) {
                const row = document.createElement("tr");
                const messageCell = document.createElement("td");
                messageCell.textContent = item.message;

                const resultCell = document.createElement("td");
                resultCell.textContent = item.classification;
                resultCell.className = item.classification === "SPAM" ? "spam" : "ham";

                const probabilityCell = document.createElement("td");
                const prob = item.probability ?? item.spam_probability ?? 0;
                probabilityCell.textContent = prob + "%";

                const timeCell = document.createElement("td");
                timeCell.textContent = item.timestamp;
                timeCell.className = "time";

                row.appendChild(messageCell);
                row.appendChild(resultCell);
                row.appendChild(probabilityCell);
                row.appendChild(timeCell);
                historyBody.appendChild(row);
            });
        }

        function updateDashboard(items, backendStats = null) {
            let total = items.length;
            let spam = items.filter(i => i.classification === "SPAM").length;
            let ham = items.filter(i => i.classification === "HAM").length;
            let avgProb = total > 0
                ? (items.reduce((sum, i) => sum + parseFloat(i.probability ?? i.spam_probability ?? 0), 0) / total).toFixed(2)
                : 0;

            if (backendStats && typeof backendStats.total === "number" && backendStats.total > total) {
                total = backendStats.total;
                spam = backendStats.spam;
                ham = backendStats.ham;
                avgProb = backendStats.average_probability;
            }

            document.getElementById("totalCount").textContent = total;
            document.getElementById("spamCount").textContent = spam;
            document.getElementById("hamCount").textContent = ham;
            document.getElementById("averageProbability").textContent = avgProb + "%";
        }

        // =========================================
        // CHECK SMS
        // =========================================
        async function checkSMS() {
            const messageInput = document.getElementById("message");
            const message = messageInput.value.trim();

            if (!message) {
                alert("Please enter an SMS message.");
                return;
            }

            const button = document.getElementById("checkButton");
            button.disabled = true;
            button.textContent = "Checking...";

            try {
                const response = await fetchAPI("/predict", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message: message })
                });

                const text = await response.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    console.error("Non-JSON backend response:", response.status, text);
                    alert(`Backend error (${response.status}): ${text.slice(0, 150) || "Invalid response"}`);
                    return;
                }

                if (!response.ok) {
                    alert(data.error || `Prediction failed (HTTP ${response.status}).`);
                    return;
                }

                const result = document.getElementById("result");
                const classification = document.getElementById("classification");
                const probability = document.getElementById("probability");
                const statusMessage = document.getElementById("status-message");

                result.style.display = "block";
                classification.textContent = data.classification;
                probability.textContent = "Spam Probability: " + data.spam_probability + "%";

                if (data.classification === "SPAM") {
                    classification.style.color = "#dc2626";
                    statusMessage.textContent = "⚠️ This message may be harmful or unwanted.";
                } else {
                    classification.style.color = "#16a34a";
                    statusMessage.textContent = "✓ This message appears to be safe.";
                }

                // Add prediction to history and update dashboard IMMEDIATELY
                const newRecord = {
                    id: data.id || Date.now(),
                    message: message,
                    classification: data.classification,
                    probability: data.spam_probability,
                    timestamp: data.timestamp || new Date().toLocaleString()
                };

                const currentHistory = getLocalHistory();
                currentHistory.unshift(newRecord);
                saveLocalHistory(currentHistory);
                renderHistory(currentHistory);
                updateDashboard(currentHistory);

                messageInput.value = "";

                // Background sync
                loadStats();
            } catch (error) {
                alert("Unable to connect to the backend: " + (error.message || error));
                console.error("Prediction error:", error);
            } finally {
                button.disabled = false;
                button.textContent = "Check SMS";
            }
        }

        // =========================================
        // LOAD HISTORY
        // =========================================
        async function loadHistory() {
            const localItems = getLocalHistory();
            renderHistory(localItems);
            updateDashboard(localItems);

            try {
                const response = await fetchAPI("/history");
                if (response.ok) {
                    const backendItems = await response.json();
                    if (Array.isArray(backendItems) && backendItems.length > 0) {
                        const existingKeys = new Set(localItems.map(i => `${i.message}_${i.timestamp}`));
                        for (const item of backendItems) {
                            const key = `${item.message}_${item.timestamp}`;
                            if (!existingKeys.has(key)) {
                                localItems.push({
                                    id: item.id,
                                    message: item.message,
                                    classification: item.classification,
                                    probability: item.probability,
                                    timestamp: item.timestamp
                                });
                                existingKeys.add(key);
                            }
                        }
                        localItems.sort((a, b) => (b.id || 0) - (a.id || 0));
                        saveLocalHistory(localItems);
                        renderHistory(localItems);
                        updateDashboard(localItems);
                    }
                }
            } catch (error) {
                console.error("History error:", error);
            }
        }

        // =========================================
        // LOAD DASHBOARD STATISTICS
        // =========================================
        async function loadStats() {
            const localItems = getLocalHistory();
            try {
                const response = await fetchAPI("/stats");
                if (response.ok) {
                    const backendStats = await response.json();
                    if (backendStats && typeof backendStats.total === "number" && backendStats.total > 0) {
                        updateDashboard(localItems, backendStats);
                        return;
                    }
                }
            } catch (error) {
                console.error("Stats error:", error);
            }
            updateDashboard(localItems);
        }

        // =========================================
        // CLEAR HISTORY
        // =========================================
        async function clearHistory() {
            const confirmClear = confirm("Are you sure you want to clear all prediction history?");
            if (!confirmClear) return;

            saveLocalHistory([]);
            renderHistory([]);
            updateDashboard([]);
            document.getElementById("result").style.display = "none";

            try {
                await fetchAPI("/clear-history", { method: "DELETE" });
            } catch (error) {
                console.error("Clear history backend note:", error);
            }
            alert("Prediction history cleared successfully.");
        }

        // =========================================
        // PAGE LOAD
        // =========================================
        window.onload = function() {
            loadHistory();
            loadStats();
        };
    </script>


</body>

</html>
